name: Upstream sync

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  track:
    name: Track upstream releases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Open issues for new upstream releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/upstream-sync.sh
