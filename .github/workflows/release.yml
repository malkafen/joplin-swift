name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v3.7.21 or v3.7.21-1
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & publish
    runs-on: macos-26
    timeout-minutes: 40
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Match upstream release
        id: upstream
        run: |
          base="$TAG"
          if [[ "$TAG" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)$ ]]; then base="${BASH_REMATCH[1]}"; fi
          if ! info=$(gh api "repos/laurent22/joplin/releases/tags/$base" 2>/dev/null); then
            echo "::error::$base is not a laurent22/joplin release. Tags must mirror upstream releases (vX.Y.Z or vX.Y.Z-N)."
            exit 1
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(jq -r .prerelease <<<"$info")" >> "$GITHUB_OUTPUT"
          echo "url=$(jq -r .html_url <<<"$info")" >> "$GITHUB_OUTPUT"

      - name: Test
        run: scripts/test.sh

      - name: Build app bundle
        run: |
          VERSION="$TAG" scripts/build-app.sh
          ZIP="Joplin-Native-$TAG-macos-arm64.zip"
          ditto -c -k --keepParent "build/Joplin Native.app" "build/$ZIP"
          (cd build && shasum -a 256 "$ZIP" > "$ZIP.sha256")
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        run: |
          previous=$(git tag --list 'v*.*.*' --sort=-v:refname | grep -vx "$TAG" | head -1 || true)
          {
            echo "Native macOS build matching upstream Joplin [${{ steps.upstream.outputs.base }}](${{ steps.upstream.outputs.url }})."
            echo
            echo "The app is ad-hoc signed, not notarized: on first launch right-click it and choose **Open**,"
            echo "or run \`xattr -dr com.apple.quarantine \"/Applications/Joplin Native.app\"\`."
            echo
            if [ -n "$previous" ]; then
              echo "### Changes since $previous"
              git log --no-merges --format='- %s (%h)' "$previous..$TAG"
            else
              echo "### Changes"
              git log --no-merges --format='- %s (%h)' "$TAG"
            fi
          } > notes.md
          flags=()
          if [ "${{ steps.upstream.outputs.prerelease }}" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "build/$ZIP" "build/$ZIP.sha256" --clobber
            gh release edit "$TAG" --notes-file notes.md "${flags[@]}"
          else
            gh release create "$TAG" "build/$ZIP" "build/$ZIP.sha256" --verify-tag \
              --title "Joplin Native $TAG" --notes-file notes.md "${flags[@]}"
          fi
